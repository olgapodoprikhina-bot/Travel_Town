<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Заказы</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap');

  :root{
    --sky:#3FB6E8;
    --sky-deep:#1E8FC4;
    --sun:#FFC93C;
    --coral:#FF6F61;
    --leaf:#5FCB7A;
    --grape:#8E6ADB;
    --cream:#FFF8EC;
    --ink:#1F3A4D;
    --board-a:#E4D9F5;
    --board-b:#D6C5EC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Nunito',sans-serif;
    background:
      radial-gradient(circle at 15% 8%, #7FD4F0 0%, transparent 45%),
      radial-gradient(circle at 90% 90%, #FFE38A 0%, transparent 40%),
      linear-gradient(160deg,var(--sky) 0%, var(--sky-deep) 100%);
    color:var(--ink);
    padding:18px 12px 60px;
  }
  h1,h2{font-family:'Baloo 2',cursive; margin:0;}
  .wrap{max-width:900px; margin:0 auto;}

  .layout{
    display:grid;
    grid-template-columns:220px 1fr;
    gap:16px;
    align-items:start;
  }
  @media(max-width:680px){ .layout{grid-template-columns:1fr;} }

  .sources-card{
    background:var(--cream);
    border-radius:16px;
    padding:10px 14px;
    box-shadow:0 6px 0 rgba(0,0,0,0.1), 0 8px 16px rgba(0,0,0,0.18);
  }

  /* --- Collapsible accordion sections --- */
  .section-toggle{
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    font-size:13px;
    font-weight:800;
    color:#4a3d2e;
    user-select:none;
  }
  .toggle-arrow{
    font-size:11px;
    color:#a89a83;
    transition:transform .2s ease;
  }
  .section-toggle.open .toggle-arrow{transform:rotate(90deg);}
  .section-content{
    margin-top:8px;
  }
  .collapsed{display:none !important;}

  /* --- Debts: intentionally quiet/compact so a long list doesn't feel heavy --- */
  .debts-card{
    margin-top:8px;
    background:rgba(255,255,255,0.55);
    border-radius:16px;
    padding:10px 12px;
  }
  .debts-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:11.5px;
    font-weight:800;
    color:#5a5142;
    opacity:0.85;
    margin-bottom:6px;
  }
  .debts-total{color:var(--coral); font-weight:800;}
  .debt-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:3px 0;
    font-size:11.5px;
    color:#6b6255;
    border-bottom:1px solid rgba(0,0,0,0.06);
  }
  .debt-row:last-child{border-bottom:none;}
  .debt-row .d-name{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .debt-row .d-sum{font-weight:700; margin:0 6px; white-space:nowrap;}
  .debt-row .d-del{
    border:none; background:none; cursor:pointer;
    color:#c9b89a; font-size:10px; opacity:0.6;
  }
  .debt-row .d-del:hover{opacity:1;}
  .debts-empty{font-size:11px; color:#a89a83; padding:2px 0;}
  .debts-add-row{
    display:flex; gap:4px; margin-top:8px;
  }
  .debts-add-row input{
    border:1.5px solid rgba(0,0,0,0.08);
    border-radius:8px;
    padding:5px 7px;
    font-size:11px;
    font-family:'Nunito',sans-serif;
    font-weight:600;
    min-width:0;
  }
  .debts-add-row input:first-child{flex:1.3;}
  .debts-add-row input:nth-child(2){flex:1;}
  .debts-add-row button{
    border:none;
    background:#D8CBB0;
    color:#5a5142;
    border-radius:8px;
    padding:5px 9px;
    font-weight:800;
    cursor:pointer;
    font-size:12px;
  }
  .source-item{
    display:flex;
    flex-direction:column;
    gap:6px;
    background:#fff;
    border-radius:14px;
    padding:10px 10px 10px;
    margin-bottom:10px;
    font-size:12.5px;
    font-weight:700;
    border-top:5px solid var(--grape);
    box-shadow:0 4px 0 rgba(0,0,0,0.1);
  }
  .source-item .top-row{
    display:flex; justify-content:space-between; align-items:flex-start;
  }
  .source-item .name{line-height:1.2;}
  .source-item .tier-ref{
    font-size:11px;
    color:#7a7264;
    font-weight:600;
    line-height:1.5;
  }
  .source-item .tier-ref small{font-size:9.5px; color:#a89a83;}
  .source-add-row{
    display:flex; gap:6px;
  }
  .source-add-row input{
    flex:1;
    min-width:0;
    border:2px solid #E9DCC0;
    border-radius:10px;
    padding:7px 9px;
    font-family:'Nunito',sans-serif;
    font-size:12.5px;
    font-weight:700;
  }
  .source-add-row button{
    border:none;
    background:var(--grape);
    color:#fff;
    border-radius:10px;
    padding:7px 10px;
    font-weight:800;
    cursor:pointer;
    font-size:12px;
    white-space:nowrap;
  }

  .header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:#fff;
    margin-bottom:14px;
    flex-wrap:wrap;
    gap:10px;
  }
  .header h1{font-size:24px; text-shadow:0 3px 0 rgba(0,0,0,0.15);}

  .add-btn{
    border:none;
    border-radius:14px;
    padding:11px 18px;
    font-weight:800;
    font-size:14px;
    cursor:pointer;
    color:#fff;
    background:var(--coral);
    box-shadow:0 4px 0 rgba(0,0,0,0.2);
  }
  .add-btn:active{transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,0.2);}

  .header-actions{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .icon-btn{
    border:none;
    border-radius:12px;
    padding:8px 12px;
    font-weight:800;
    font-size:12px;
    cursor:pointer;
    color:#3a5a78;
    background:rgba(255,255,255,0.85);
    box-shadow:0 3px 0 rgba(0,0,0,0.15);
  }
  .icon-btn:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,0.15);}

  /* --- Calendar (tiny hint-sized widget) --- */
  .calendar-card{
    background:var(--cream);
    border-radius:10px;
    padding:6px 8px;
    box-shadow:0 3px 0 rgba(0,0,0,0.1), 0 4px 8px rgba(0,0,0,0.15);
    margin-bottom:10px;
    max-width:200px;
  }
  .calendar-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:3px;
    margin-bottom:3px;
  }
  .calendar-head h2{font-size:9px; text-transform:capitalize; font-weight:800;}
  .calendar-legend{
    display:none;
  }
  .calendar-weekdays{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    font-size:6px;
    font-weight:800;
    color:#a89a83;
    text-align:center;
    margin-bottom:1px;
  }
  .calendar-grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:1px;
  }
  .cal-day{
    aspect-ratio:1;
    border-radius:3px;
    background:rgba(0,0,0,0.03);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-size:6.5px;
    font-weight:700;
    color:#6b6255;
    position:relative;
    gap:0;
  }
  .cal-day.empty{background:none;}
  .cal-day.today{
    background:var(--coral);
    color:#fff;
    box-shadow:0 1px 0 rgba(0,0,0,0.15);
  }
  .cal-dots{
    display:flex;
    gap:1px;
    flex-wrap:wrap;
    justify-content:center;
    max-width:14px;
    position:absolute;
    bottom:0px;
  }
  .cal-dots i{
    width:2px; height:2px;
    border-radius:50%;
    display:inline-block;
  }

  /* --- Orders strip --- */
  .urgent-section{
    margin-bottom:10px;
  }
  .urgent-title{
    font-size:12.5px;
    font-weight:800;
    color:#fff;
    text-shadow:0 2px 0 rgba(0,0,0,0.15);
    margin-bottom:6px;
  }
  .cat-section{
    background:rgba(255,255,255,0.55);
    border-radius:14px;
    padding:8px 12px;
    margin-bottom:8px;
  }
  .cat-section-toggle{
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    user-select:none;
  }
  .cat-section-title{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    font-weight:800;
    color:#2B2620;
  }
  .cat-dot{width:9px; height:9px; border-radius:50%; display:inline-block;}
  .cat-section-meta{
    font-size:10.5px;
    font-weight:700;
    color:#7a7264;
  }
  .orders-strip{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    padding:4px 2px 10px;
    margin-bottom:6px;
  }
  .order-card{
    flex:0 0 auto;
    width:104px;
    background:var(--cream);
    border-radius:12px;
    padding:8px 8px 7px;
    box-shadow:0 4px 0 rgba(0,0,0,0.12), 0 6px 10px rgba(0,0,0,0.16);
    border-top:5px solid var(--cat-color, var(--sky-deep));
  }
  .card-controls{
    display:flex;
    justify-content:flex-end;
    gap:3px;
    margin-bottom:1px;
  }
  .ctrl-btn{
    border:none;
    background:rgba(0,0,0,0.05);
    color:#8a7264;
    width:16px; height:16px;
    border-radius:5px;
    font-size:9px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .ctrl-btn:hover{background:rgba(0,0,0,0.1); color:#3a3226;}
  .order-card .name{font-family:'Baloo 2',cursive; font-size:12px; line-height:1.1; margin-bottom:2px;}
  .order-card .purpose{display:none;}
  .order-card .sum{font-size:12.5px; font-weight:800; color:var(--sky-deep);}
  .order-card .cat{
    display:inline-block;
    margin-top:3px;
    font-size:8px;
    font-weight:800;
    padding:2px 6px;
    border-radius:20px;
    background:var(--cat-color, var(--sky-deep));
    color:#fff;
  }
  .due-badge{
    margin-top:4px;
    font-size:8px;
    font-weight:800;
    padding:2px 6px;
    border-radius:20px;
    display:inline-block;
    line-height:1.3;
  }
  .due-badge.due-ok{background:#E4F4E6; color:#3A8A4E;}
  .due-badge.due-today{background:#FFF0C4; color:#8A6A00;}
  .due-badge.due-overdue{background:#FFE0DC; color:var(--coral); animation:pulseOverdue 1.4s ease-in-out infinite;}
  @keyframes pulseOverdue{
    0%,100%{opacity:1;}
    50%{opacity:0.55;}
  }
  .order-card .pay-btn{
    display:block;
    width:100%;
    margin-top:5px;
    border:none;
    background:var(--leaf);
    color:#fff;
    font-weight:800;
    font-size:9.5px;
    padding:4px 0;
    border-radius:8px;
    cursor:pointer;
  }
  .order-card .pay-btn:active{transform:translateY(1px);}
  .archive-toggle{
    color:#fff;
    font-size:12px;
    font-weight:800;
    opacity:0.85;
    cursor:pointer;
    padding:0 4px 8px;
    text-decoration:underline;
    display:inline-block;
  }
  .archive-list{
    display:none;
    background:rgba(255,255,255,0.92);
    border-radius:14px;
    padding:10px 12px;
    margin:0 2px 12px;
    font-size:12.5px;
  }
  .archive-list.show{display:block;}
  .archive-item{
    display:flex; justify-content:space-between;
    padding:5px 0;
    border-bottom:1px solid #eee2cc;
  }
  .archive-item:last-child{border-bottom:none;}

  .empty-orders{
    color:#fff;
    font-weight:700;
    font-size:13px;
    opacity:0.85;
    padding:8px 4px 16px;
  }

  /* --- Board --- */
  .board-card{
    background:var(--cream);
    border-radius:22px;
    padding:14px;
    box-shadow:0 10px 0 rgba(0,0,0,0.12), 0 14px 26px rgba(0,0,0,0.25);
  }
  .board-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    padding:0 2px;
  }
  .board-head h2{font-size:15px;}
  .sum-counter{
    background:var(--sun);
    color:#7A5300;
    font-weight:800;
    font-size:13px;
    padding:5px 13px;
    border-radius:20px;
  }
  .board{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    grid-template-rows:repeat(8, 1fr);
    gap:0;
    border-radius:14px;
    overflow:hidden;
    aspect-ratio:7/8;
  }
  .board-cell{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:20px;
    cursor:pointer;
    transition:box-shadow .15s ease;
    gap:1px;
  }
  .board-cell .cell-value{
    font-size:8px;
    font-weight:800;
    color:#4a3d63;
    opacity:0.75;
  }
  .board-cell.selected{
    box-shadow:inset 0 0 0 3px var(--coral);
  }
  .board-cell.a{background:var(--board-a);}
  .board-cell.b{background:var(--board-b);}

  /* --- Modal --- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(20,30,40,0.45);
    display:none;
    align-items:center; justify-content:center;
    padding:16px;
    z-index:10;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--cream);
    border-radius:20px;
    padding:22px;
    width:100%;
    max-width:380px;
    box-shadow:0 16px 40px rgba(0,0,0,0.35);
  }
  .modal h2{font-size:19px; margin-bottom:14px;}
  .field{display:flex; flex-direction:column; gap:4px; margin-bottom:12px;}
  .field label{font-size:12px; font-weight:800; color:#6b5a3f;}
  .field input, .field select{
    border:3px solid #E9DCC0;
    border-radius:12px;
    padding:9px 11px;
    font-family:'Nunito',sans-serif;
    font-weight:700;
    font-size:14.5px;
    background:#fff;
  }
  .modal-actions{
    display:flex; gap:8px; margin-top:16px;
  }
  .modal-actions button{
    flex:1;
    border:none;
    border-radius:12px;
    padding:10px;
    font-weight:800;
    font-size:13.5px;
    cursor:pointer;
  }
  .btn-cancel{background:#E9DCC0; color:#6b5a3f;}
  .btn-save{background:var(--leaf); color:#fff;}

  .icon-choice{
    width:64px; height:64px;
    border-radius:14px;
    border:3px solid #E9DCC0;
    background:#fff;
    font-size:28px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .icon-choice:hover{border-color:var(--leaf); background:#F2FBF3;}
  .icon-choice:active{transform:translateY(2px);}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>🧵 Мои заказы</h1>
    <div class="header-actions">
      <button class="icon-btn" onclick="exportData()" title="Скачать резервную копию данных">💾 Сохранить</button>
      <button class="icon-btn" onclick="document.getElementById('importFile').click()" title="Загрузить данные из файла">📂 Загрузить</button>
      <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importData(event)">
      <button class="add-btn" onclick="openModal()">+ Добавить заказ</button>
    </div>
  </div>

  <div class="layout">
    <div>
      <div class="calendar-card">
        <div class="calendar-head">
          <h2 id="calMonthLabel">Месяц</h2>
        </div>
        <div class="calendar-weekdays">
          <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </div>

      <div class="sources-card">
        <div class="section-toggle" onclick="toggleSection('sources')">
          <span>💰 Источники дохода</span>
          <span class="toggle-arrow" id="arrow-sources">▸</span>
        </div>
        <div id="sourcesContent" class="section-content collapsed">
          <div id="sourcesList"></div>
        </div>
      </div>

      <div class="debts-card">
        <div class="section-toggle" onclick="toggleSection('debts')">
          <span>📋 Мои долги</span>
          <span class="debts-total" id="debtsTotal">0 грн</span>
          <span class="toggle-arrow" id="arrow-debts">▸</span>
        </div>
        <div id="debtsContent" class="section-content collapsed">
          <div id="debtsList"></div>
          <div class="debts-add-row">
            <input id="fDebtName" type="text" placeholder="Название">
            <input id="fDebtSum" type="text" inputmode="decimal" placeholder="Сумма">
            <button onclick="addDebt()">+</button>
          </div>
        </div>
      </div>
    </div>

    <div>
  <div id="ordersByCategory"></div>
  <div class="archive-toggle" onclick="toggleArchive()" id="archiveToggle">Архив (0)</div>
  <div class="archive-list" id="archiveList"></div>

      <div class="board-card">
        <div class="board-head">
          <h2>🎯 Доска</h2>
          <div class="sum-counter">💰 <span id="totalSumDisplay">0</span> грн</div>
        </div>
        <div class="board" id="board"></div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Новый заказ</h2>
    <div class="field">
      <label>Название заказа</label>
      <input id="fName" placeholder="Например: платье для Полины">
    </div>
    <div class="field">
      <label>Для чего</label>
      <input id="fPurpose" placeholder="Например: соревнования в сентябре">
    </div>
    <div class="field">
      <label>Сумма, грн</label>
      <input id="fSum" type="text" inputmode="decimal" placeholder="3500">
    </div>
    <div class="field">
      <label>Категория</label>
      <select id="fCategory" onchange="toggleDebtSelect()">
        <option value="Константа: Кредит">Константа: Кредит</option>
        <option value="Константа: Коммуналка">Константа: Коммуналка</option>
        <option value="Прожиточный минимум">Прожиточный минимум (еда)</option>
        <option value="Непредвиденные расходы">Непредвиденные расходы</option>
        <option value="Ну очень надо">Ну очень надо</option>
      </select>
    </div>
    <div class="field">
      <label>Дата платежа (для фиксированных — обязательно)</label>
      <input id="fDate" type="date">
    </div>
    <div class="field">
      <label style="display:flex; align-items:center; gap:6px; font-weight:800;">
        <input type="checkbox" id="fRecurring" style="width:auto;">
        Повторяется каждый месяц (пока не закрою)
      </label>
    </div>
    <div class="field">
      <label style="display:flex; align-items:center; gap:6px; font-weight:800;">
        <input type="checkbox" id="fIsDebt" onchange="toggleDebtSelect()" style="width:auto;">
        Этот заказ — платёж по долгу
      </label>
    </div>
    <div class="field" id="debtSelectField" style="display:none;">
      <label>Какой долг</label>
      <select id="fDebtLink"></select>
    </div>
    <div class="field" id="debtPrincipalField" style="display:none;">
      <label>Сколько из этой суммы идёт на тело кредита (остальное — проценты)</label>
      <input id="fDebtPrincipal" type="text" inputmode="decimal" placeholder="Например: 400 из 550">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Отмена</button>
      <button class="btn-save" onclick="saveOrder()">Добавить</button>
    </div>
    <div id="formError" style="color:#B5483D; font-size:12px; font-weight:700; margin-top:8px; display:none;"></div>
  </div>
</div>

<div class="overlay" id="payOverlay">
  <div class="modal">
    <h2 id="payOrderName">Оплатить заказ</h2>
    <div style="font-size:12.5px; color:#7a7264; font-weight:700; margin-bottom:12px;">Выбери, чем оплачиваешь</div>
    <div id="payIconGrid" style="display:flex; gap:10px; justify-content:center; margin-bottom:6px;"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closePayModal()">Отмена</button>
    </div>
  </div>
</div>

<script>
let orders = [];
let archivedOrders = [];
let idCounter = 1;

const ORDER_ICONS = {
  'Константа: Кредит': ['📄','🧾','🏦'],
  'Константа: Коммуналка': ['💡','🧾','🏠'],
  'Прожиточный минимум': ['🥕','🍞','🛒'],
  'Непредвиденные расходы': ['⚡','🔧','🚨'],
  'Ну очень надо': ['💝','🎁','💎']
};
let sources = [
  {id:'s1', name:'Пошив костюмов', category:'Пошив костюмов', clicks:0},
  {id:'s2', name:'От Провидения', category:'От Провидения', clicks:0}
];
let sourceIdCounter = 3;

let debts = [];
let debtIdCounter = 1;

const SOURCE_ICONS = {
  'Пошив костюмов': ['🪡','🧵','✂️'],
  'От Провидения': ['🍬','🍭','🍰']
};

function tierForAmount(amt){
  if(amt <= 500) return 0;
  if(amt <= 1000) return 1;
  return 2;
}

function tierIcon(category, value){
  const icons = SOURCE_ICONS[category] || ORDER_ICONS[category] || ['⭐','🌟','✨'];
  return icons[tierForAmount(value)];
}

const BOARD_COLS = 7, BOARD_ROWS = 8;
// each cell is null or {icon, category, value}
let boardCells = new Array(BOARD_COLS*BOARD_ROWS).fill(null);
let selectedCellIdx = null;
let totalSum = 0;

// once an item reaches the top tier of its category, further same-icon merges assemble pieces
// toward a final icon (e.g. cake slices -> whole cake) instead of stopping
const MANNEQUIN_SVG = `<svg viewBox="0 0 100 150" width="26" height="26" style="vertical-align:middle;">
  <path d="M38,18 C38,8 62,8 62,18 C64,24 64,28 61,32 C67,40 68,55 63,66 C70,76 70,92 63,100 C67,105 67,113 61,116 L39,116 C33,113 33,105 37,100 C30,92 30,76 37,66 C32,55 33,40 39,32 C36,28 36,24 38,18 Z"
    fill="#2B2620" stroke="#2B2620" stroke-width="2" stroke-linejoin="round"/>
  <line x1="50" y1="116" x2="50" y2="133" stroke="#2B2620" stroke-width="3"/>
  <path d="M50,133 C42,133 36,137 36,141 C36,144 40,145 42,142" fill="none" stroke="#2B2620" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M50,133 C58,133 64,137 64,141 C64,144 60,145 58,142" fill="none" stroke="#2B2620" stroke-width="2.5" stroke-linecap="round"/>
</svg>`;

const ASSEMBLY = {
  'От Провидения': {maxPieces: 6, finalIcon: '🎂'},
  'Пошив костюмов': {maxPieces: 6, finalIcon: MANNEQUIN_SVG}
};

// merge rule: two items of the same category and same tier combine into the next tier of that category
// e.g. needle+needle -> spool, spool+spool -> scissors; candy+candy -> lollipop, lollipop+lollipop -> cake
function tryMerge(a, b){
  if(a.category !== b.category) return null;
  if(a.icon !== b.icon) return null;
  const icons = SOURCE_ICONS[a.category] || ORDER_ICONS[a.category];
  if(!icons) return null;
  const tierIdx = icons.indexOf(a.icon);
  if(tierIdx === -1) return null;

  if(tierIdx + 1 < icons.length){
    // normal ladder upgrade to the next tier
    return {icon: icons[tierIdx+1], category: a.category, value: a.value + b.value, pieces: 1};
  }

  // already at top tier — check if this category assembles further
  const assembly = ASSEMBLY[a.category];
  if(!assembly) return null;

  const totalPieces = (a.pieces || 1) + (b.pieces || 1);
  const value = a.value + b.value;
  if(totalPieces >= assembly.maxPieces){
    return {icon: assembly.finalIcon, category: a.category, value, pieces: assembly.maxPieces};
  }
  return {icon: a.icon, category: a.category, value, pieces: totalPieces};
}

function saveOrder(){
  const name = document.getElementById('fName').value.trim();
  const purpose = document.getElementById('fPurpose').value.trim();
  const sum = parseFloat(document.getElementById('fSum').value.replace(',', '.'));
  const category = document.getElementById('fCategory').value;
  const dueDate = document.getElementById('fDate').value;
  const isDebt = document.getElementById('fIsDebt').checked;
  const isCredit = category === 'Константа: Кредит';
  const debtId = isDebt ? parseInt(document.getElementById('fDebtLink').value) : null;
  const debtPrincipal = (isDebt && isCredit) ? parseFloat(document.getElementById('fDebtPrincipal').value.replace(',', '.')) : null;
  const errEl = document.getElementById('formError');

  if(!name || !sum || sum<=0){
    errEl.textContent = !name ? 'Впиши название заказа' : 'Впиши корректную сумму';
    errEl.style.display = 'block';
    return;
  }
  if((category === 'Константа: Кредит' || category === 'Константа: Коммуналка') && !dueDate){
    errEl.textContent = 'Для константы нужна дата платежа';
    errEl.style.display = 'block';
    return;
  }
  if(isDebt && !debtId){
    errEl.textContent = 'Выбери долг из списка';
    errEl.style.display = 'block';
    return;
  }
  if(isDebt && isCredit && (!debtPrincipal || debtPrincipal <= 0 || debtPrincipal > sum)){
    errEl.textContent = 'Впиши сумму на тело кредита (не больше общей суммы платежа)';
    errEl.style.display = 'block';
    return;
  }
  errEl.style.display = 'none';
  const recurring = document.getElementById('fRecurring').checked;

  if(editingOrderId){
    const o = orders.find(x => x.id === editingOrderId);
    if(o){
      Object.assign(o, {name, purpose, sum, category, dueDate: dueDate || null, debtId: debtId || null, debtPrincipal: debtPrincipal || null, recurring, escalated:false});
    }
  } else {
    orders.push({id:idCounter++, name, purpose, sum, category, dueDate: dueDate || null, debtId: debtId || null, debtPrincipal: debtPrincipal || null, recurring, escalated:false});
  }
  closeModal();
  renderOrders();
}

let payingOrderId = null;

function payOrder(id){
  payingOrderId = id;
  const order = orders.find(o => o.id === id);
  if(!order) return;
  document.getElementById('payOrderName').textContent = 'Оплатить: ' + order.name;

  const grid = document.getElementById('payIconGrid');
  const usableIndexes = boardCells
    .map((c, i) => (c && c.value >= order.sum) ? i : null)
    .filter(i => i !== null);

  if(usableIndexes.length === 0){
    const hasAny = boardCells.some(c => c !== null);
    grid.innerHTML = hasAny
      ? `<div style="font-size:12.5px; color:#8a7264;">Ни в одной иконке не хватает суммы (нужно ${order.sum.toLocaleString('ru-RU')} грн) — накопи ещё или объедини иконки слиянием.</div>`
      : '<div style="font-size:12.5px; color:#8a7264;">На доске пока нет иконок для оплаты.</div>';
  } else {
    grid.innerHTML = usableIndexes.map(i => `
      <div class="icon-choice" onclick="confirmPay(${i})" style="flex-direction:column; gap:2px;">
        <div>${boardCells[i].icon}</div>
        <div style="font-size:9px; font-weight:800; color:#8a7264;">${boardCells[i].value.toLocaleString('ru-RU')}</div>
      </div>
    `).join('');
  }

  document.getElementById('payOverlay').classList.add('show');
}

function closePayModal(){
  document.getElementById('payOverlay').classList.remove('show');
  payingOrderId = null;
}

function confirmPay(cellIdx){
  const idx = orders.findIndex(o => o.id === payingOrderId);
  if(idx === -1) return;
  const order = orders[idx];
  const item = boardCells[cellIdx];
  if(!item) return;

  orders.splice(idx,1);
  archivedOrders.push(order);
  totalSum -= order.sum;

  if(order.debtId){
    const debt = debts.find(d => d.id === order.debtId);
    if(debt){
      debt.sum -= (order.debtPrincipal || order.sum);
      if(debt.sum <= 0){
        debts = debts.filter(d => d.id !== order.debtId);
      }
    }
  }

  const remaining = item.value - order.sum;
  if(remaining <= 0){
    boardCells[cellIdx] = null;
  } else {
    boardCells[cellIdx] = {icon: tierIcon(item.category, remaining), category:item.category, value:remaining, pieces:1};
  }

  closePayModal();
  renderOrders();
  renderArchive();
  renderDebts();
  renderBoard();
}

function placeFromSource(id){

  if(!s) return;
  const input = document.getElementById('amt-'+id);
  const amt = parseFloat(input.value.replace(',', '.'));
  if(!amt || amt <= 0) return;

  const icon = tierIcon(s.category, amt);

  const emptyIdx = boardCells.findIndex(c => c === null);
  if(emptyIdx === -1){
    input.value = '';
    return; // board full
  }
  boardCells[emptyIdx] = {icon, category:s.category, value:amt, pieces:1};
  totalSum += amt;
  input.value = '';
  renderBoard();
}

function handleCellClick(idx){
  const item = boardCells[idx];
  if(!item) return;

  if(selectedCellIdx === null){
    selectedCellIdx = idx;
    renderBoard();
    return;
  }
  if(selectedCellIdx === idx){
    selectedCellIdx = null;
    renderBoard();
    return;
  }

  const a = boardCells[selectedCellIdx];
  const b = boardCells[idx];
  const result = tryMerge(a, b);

  if(result){
    boardCells[idx] = result;
    boardCells[selectedCellIdx] = null;
    selectedCellIdx = null;
  } else {
    selectedCellIdx = idx;
  }
  renderBoard();
}

function daysLeftLabel(dueDate){
  if(!dueDate) return '';
  const today = new Date();
  today.setHours(0,0,0,0);
  const due = new Date(dueDate + 'T00:00:00');
  const diffDays = Math.round((due - today) / 86400000);

  if(diffDays > 0){
    return `<div class="due-badge due-ok">Осталось: ${diffDays} дн.</div>`;
  } else if(diffDays === 0){
    return `<div class="due-badge due-today">Сегодня срок!</div>`;
  } else {
    return `<div class="due-badge due-overdue">Просрочено: ${Math.abs(diffDays)} дн.</div>`;
  }
}

function daysUntil(dueDate){
  if(!dueDate) return Infinity;
  const today = new Date();
  today.setHours(0,0,0,0);
  const due = new Date(dueDate + 'T00:00:00');
  return Math.round((due - today) / 86400000);
}

// Unlike credit (where a payment reduces the debt), an unpaid utility bill past its due date
// gets added ON TOP of the linked debt instead — the missed bill becomes part of what's owed.
function isPastBillingMonth(dueDate){
  const due = new Date(dueDate + 'T00:00:00');
  const today = new Date();
  today.setHours(0,0,0,0);
  return (today.getFullYear() > due.getFullYear()) ||
    (today.getFullYear() === due.getFullYear() && today.getMonth() > due.getMonth());
}

// Stage 1 (due date passed, same month): stays visible as overdue in the urgent list — no debt change yet.
// Stage 2 (the billing month has actually ended and it's still unpaid): NOW it gets added to the linked debt.
function escalateOverdueUtilities(){
  orders.forEach(o => {
    if(o.category !== 'Константа: Коммуналка') return;
    if(!o.debtId) return;
    if(o.escalated) return;
    if(!o.dueDate || !isPastBillingMonth(o.dueDate)) return;

    const debt = debts.find(d => d.id === o.debtId);
    if(debt){
      debt.sum += o.sum;
    }
    o.escalated = true;
  });

  const toArchive = orders.filter(o => o.escalated);
  if(toArchive.length > 0){
    toArchive.forEach(o => archivedOrders.push(o));
    orders = orders.filter(o => !o.escalated);
    renderDebts();
  }
}

let openSections = new Set(); // 'sources', 'debts', 'cat-<Category>'

function toggleSection(key){
  if(openSections.has(key)) openSections.delete(key);
  else openSections.add(key);
  if(key === 'sources' || key === 'debts'){
    applySectionState();
  } else {
    renderOrders();
  }
}

function applySectionState(){
  ['sources','debts'].forEach(key => {
    const content = document.getElementById(key+'Content');
    const arrow = document.getElementById('arrow-'+key);
    const isOpen = openSections.has(key);
    if(content) content.classList.toggle('collapsed', !isOpen);
    if(arrow) arrow.textContent = isOpen ? '▾' : '▸';
  });
}

const CATEGORY_ORDER = ['Константа: Кредит','Константа: Коммуналка','Прожиточный минимум','Непредвиденные расходы','Ну очень надо'];

const URGENT_THRESHOLD_DAYS = 3;

function renderOrderCard(o){
  const debt = o.debtId ? debts.find(d => d.id === o.debtId) : null;
  const debtBadge = debt
    ? `<div class="due-badge" style="background:#EFE6F7; color:#6a4b9c;">📋 ${escapeHtml(debt.name)}</div>`
    : '';
  return `
    <div class="order-card" style="--cat-color:${CAT_COLORS[o.category]||'#1E8FC4'}">
      <div class="card-controls">
        <button class="ctrl-btn" onclick="editOrder(${o.id})" title="Изменить">✎</button>
        <button class="ctrl-btn" onclick="deleteOrderDraft(${o.id})" title="Удалить">✕</button>
      </div>
      <div class="name">${escapeHtml(o.name)}</div>
      <div class="purpose">${escapeHtml(o.purpose)}</div>
      <div class="sum">${o.sum.toLocaleString('ru-RU')} грн</div>
      <div class="cat">${escapeHtml(o.category)}</div>
      ${daysLeftLabel(o.dueDate)}
      ${debtBadge}
      <button class="pay-btn" onclick="payOrder(${o.id})">✓ Оплатить</button>
    </div>
  `;
}

function renderOrders(){
  const container = document.getElementById('ordersByCategory');

  // migrate any legacy category names (e.g. the old single "Константа") so nothing gets orphaned
  orders.forEach(o => {
    if(o.category === 'Константа') o.category = 'Константа: Кредит';
  });

  escalateOverdueUtilities();

  if(orders.length === 0){
    container.innerHTML = '<div class="empty-orders">Пока нет заказов — нажми "Добавить заказ" выше.</div>';
    renderCalendar();
    return;
  }

  const isUrgent = o => o.dueDate && daysUntil(o.dueDate) <= URGENT_THRESHOLD_DAYS;
  const urgent = orders.filter(isUrgent).sort((a,b) => daysUntil(a.dueDate) - daysUntil(b.dueDate));
  const rest = orders.filter(o => !isUrgent(o));

  let html = '';

  if(urgent.length > 0){
    const overdueSum = urgent.filter(o => daysUntil(o.dueDate) < 0).reduce((s,o) => s + o.sum, 0);
    const pendingSum = urgent.filter(o => daysUntil(o.dueDate) >= 0).reduce((s,o) => s + o.sum, 0);
    const key = 'urgent';
    const isOpen = openSections.has(key);
    html += `
    <div class="cat-section urgent-section">
      <div class="cat-section-toggle" onclick="toggleSection('${key}')">
        <div class="cat-section-title">🔥 Срочно и просрочено</div>
        <div class="cat-section-meta">
          ${pendingSum > 0 ? `Ожидает: ${pendingSum.toLocaleString('ru-RU')} грн` : ''}
          ${pendingSum > 0 && overdueSum > 0 ? ' · ' : ''}
          ${overdueSum > 0 ? `<span style="color:var(--coral);">Просрочено: ${overdueSum.toLocaleString('ru-RU')} грн</span>` : ''}
          <span class="toggle-arrow" id="arrow-${key}">${isOpen?'▾':'▸'}</span>
        </div>
      </div>
      <div class="orders-strip cat-section-content${isOpen?'':' collapsed'}" data-key="${key}">
        ${urgent.map(renderOrderCard).join('')}
      </div>
    </div>
    `;
  }

  const seenIds = new Set();

  CATEGORY_ORDER.forEach(cat => {
    const inCat = rest.filter(o => o.category === cat).sort((a,b) => daysUntil(a.dueDate) - daysUntil(b.dueDate));
    if(inCat.length === 0) return;
    inCat.forEach(o => seenIds.add(o.id));
    const key = 'cat-' + cat;
    const total = inCat.reduce((s,o) => s + o.sum, 0);
    const isOpen = openSections.has(key);

    html += `
    <div class="cat-section">
      <div class="cat-section-toggle" onclick="toggleSection('${key}')">
        <div class="cat-section-title">
          <span class="cat-dot" style="background:${CAT_COLORS[cat]}"></span>
          ${escapeHtml(cat)}
        </div>
        <div class="cat-section-meta">${inCat.length} шт · ${total.toLocaleString('ru-RU')} грн <span class="toggle-arrow" id="arrow-${key}">${isOpen?'▾':'▸'}</span></div>
      </div>
      <div class="orders-strip cat-section-content${isOpen?'':' collapsed'}" data-key="${key}">
        ${inCat.map(renderOrderCard).join('')}
      </div>
    </div>
    `;
  });

  // safety net: any non-urgent order whose category didn't match a known bucket still gets shown, not hidden
  const orphaned = rest.filter(o => !seenIds.has(o.id)).sort((a,b) => daysUntil(a.dueDate) - daysUntil(b.dueDate));
  if(orphaned.length > 0){
    const key = 'cat-other';
    const total = orphaned.reduce((s,o) => s + o.sum, 0);
    const isOpen = openSections.has(key);
    html += `
    <div class="cat-section">
      <div class="cat-section-toggle" onclick="toggleSection('${key}')">
        <div class="cat-section-title">
          <span class="cat-dot" style="background:#a89a83"></span>
          Другое
        </div>
        <div class="cat-section-meta">${orphaned.length} шт · ${total.toLocaleString('ru-RU')} грн <span class="toggle-arrow" id="arrow-${key}">${isOpen?'▾':'▸'}</span></div>
      </div>
      <div class="orders-strip cat-section-content${isOpen?'':' collapsed'}" data-key="${key}">
        ${orphaned.map(renderOrderCard).join('')}
      </div>
    </div>
    `;
  }

  container.innerHTML = html;
  renderCalendar();
}

const MONTH_NAMES = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];

function renderCalendar(){
  const today = new Date();
  today.setHours(0,0,0,0);
  const year = today.getFullYear();
  const month = today.getMonth();

  document.getElementById('calMonthLabel').textContent = `${MONTH_NAMES[month]} ${year}`;

  const firstOfMonth = new Date(year, month, 1);
  const daysInMonth = new Date(year, month+1, 0).getDate();
  // Monday-first weekday index (0=Mon..6=Sun)
  let leadingBlanks = firstOfMonth.getDay() - 1;
  if(leadingBlanks < 0) leadingBlanks = 6;

  // build day -> [colors] map from unpaid orders
  const dayMarks = {};
  orders.forEach(o => {
    if(!o.dueDate) return;
    const due = new Date(o.dueDate + 'T00:00:00');
    let targetDay = null;
    if(o.recurring){
      targetDay = due.getDate();
    } else if(due.getFullYear() === year && due.getMonth() === month){
      targetDay = due.getDate();
    }
    if(targetDay){
      if(!dayMarks[targetDay]) dayMarks[targetDay] = [];
      dayMarks[targetDay].push(CAT_COLORS[o.category] || '#1E8FC4');
    }
  });

  const grid = document.getElementById('calendarGrid');
  let html = '';
  for(let i=0;i<leadingBlanks;i++){
    html += '<div class="cal-day empty"></div>';
  }
  for(let d=1; d<=daysInMonth; d++){
    const isToday = d === today.getDate();
    const dots = (dayMarks[d] || []).map(c => `<i style="background:${c}"></i>`).join('');
    const dotsHtml = dots ? `<div class="cal-dots">${dots}</div>` : '';
    html += `<div class="cal-day${isToday?' today':''}">${d}${dotsHtml}</div>`;
  }
  grid.innerHTML = html;
}

function renderBoard(){
  const board = document.getElementById('board');
  let html = '';
  for(let r=0;r<BOARD_ROWS;r++){
    for(let c=0;c<BOARD_COLS;c++){
      const idx = r*BOARD_COLS + c;
      const shade = (r+c) % 2 === 0 ? 'a' : 'b';
      const item = boardCells[idx];
      const sel = idx === selectedCellIdx ? ' selected' : '';
      let inner = '';
      if(item){
        const assembly = ASSEMBLY[item.category];
        const isAssembling = assembly && item.pieces && item.pieces > 1 && item.icon !== assembly.finalIcon;
        const piecesBadge = isAssembling ? `<div class="cell-value">${item.pieces}/${assembly.maxPieces}</div>` : '';
        inner = `<div>${item.icon}</div>${piecesBadge}<div class="cell-value">${item.value.toLocaleString('ru-RU')}</div>`;
      }
      html += `<div class="board-cell ${shade}${sel}" onclick="handleCellClick(${idx})">${inner}</div>`;
    }
  }
  board.innerHTML = html;
  const sumEl = document.getElementById('totalSumDisplay');
  sumEl.textContent = totalSum.toLocaleString('ru-RU');
  document.querySelector('.sum-counter').style.background = totalSum < 0 ? 'var(--coral)' : 'var(--sun)';
  document.querySelector('.sum-counter').style.color = totalSum < 0 ? '#fff' : '#7A5300';
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function exportData(){
  const data = {
    savedAt: new Date().toISOString(),
    orders, archivedOrders, idCounter,
    sources, sourceIdCounter,
    debts, debtIdCounter,
    boardCells, totalSum
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `moi-zakazy-backup-${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      if(!data || typeof data !== 'object'){
        alert('Файл повреждён или это не резервная копия.');
        return;
      }
      orders = data.orders || [];
      archivedOrders = data.archivedOrders || [];
      idCounter = data.idCounter || 1;
      sources = data.sources || sources;
      sourceIdCounter = data.sourceIdCounter || sourceIdCounter;
      debts = data.debts || [];
      debtIdCounter = data.debtIdCounter || 1;
      boardCells = data.boardCells || new Array(BOARD_COLS*BOARD_ROWS).fill(null);
      totalSum = data.totalSum || 0;
      selectedCellIdx = null;

      renderSources();
      renderDebts();
      renderOrders();
      renderArchive();
      renderBoard();
    } catch(err){
      alert('Не получилось прочитать файл: ' + err.message);
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

renderSources();
renderDebts();
renderOrders();
renderArchive();
renderBoard();
</script>
</body>
