<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Закрыть кредит</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap');

  :root{
    --sky:#3FB6E8;
    --sky-deep:#1E8FC4;
    --sun:#FFC93C;
    --coral:#FF6F61;
    --leaf:#5FCB7A;
    --grape:#8E6ADB;
    --cream:#FFF8EC;
    --ink:#1F3A4D;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Nunito',sans-serif;
    background:
      radial-gradient(circle at 15% 10%, #7FD4F0 0%, transparent 45%),
      radial-gradient(circle at 90% 85%, #FFE38A 0%, transparent 40%),
      linear-gradient(160deg,var(--sky) 0%, var(--sky-deep) 100%);
    color:var(--ink);
    padding:20px 14px 60px;
  }
  h1,h2{font-family:'Baloo 2',cursive; margin:0;}
  .wrap{max-width:640px; margin:0 auto;}

  .header{
    text-align:center;
    color:#fff;
    margin-bottom:18px;
  }
  .header h1{
    font-size:28px;
    text-shadow:0 3px 0 rgba(0,0,0,0.15);
  }
  .header p{margin:4px 0 0; font-size:13.5px; opacity:0.9; font-weight:700;}

  .card{
    background:var(--cream);
    border-radius:22px;
    padding:20px;
    box-shadow:0 10px 0 rgba(0,0,0,0.12), 0 14px 26px rgba(0,0,0,0.25);
    margin-bottom:18px;
  }

  .setup-row{display:flex; gap:10px; flex-wrap:wrap; align-items:end;}
  .field{display:flex; flex-direction:column; gap:4px; flex:1; min-width:140px;}
  .field label{font-size:12px; font-weight:800; color:#6b5a3f;}
  .field input{
    border:3px solid #E9DCC0;
    border-radius:14px;
    padding:9px 12px;
    font-family:'Nunito',sans-serif;
    font-weight:700;
    font-size:16px;
    background:#fff;
  }
  .btn{
    border:none;
    border-radius:14px;
    padding:11px 18px;
    font-weight:800;
    font-size:14px;
    cursor:pointer;
    color:#fff;
    box-shadow:0 4px 0 rgba(0,0,0,0.18);
  }
  .btn:active{transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,0.18);}
  .btn-sky{background:var(--sky-deep);}
  .btn-coral{background:var(--coral);}
  .btn-leaf{background:var(--leaf);}

  .progress-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }
  .progress-head .amounts{font-family:'Baloo 2',cursive; font-size:19px; color:var(--sky-deep);}
  .progress-head .pct{
    background:var(--sun);
    color:#7A5300;
    font-weight:800;
    font-size:13px;
    padding:4px 12px;
    border-radius:20px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(10, 1fr);
    gap:6px;
    margin:10px 0 4px;
  }
  .cell{
    aspect-ratio:1;
    border-radius:8px;
    background:#EDE4CD;
    border:2px solid rgba(0,0,0,0.05);
    transition:all .35s cubic-bezier(.34,1.56,.64,1);
  }
  .cell.filled{
    background:linear-gradient(155deg,#FFD873,var(--sun));
    box-shadow:0 0 0 2px rgba(255,201,60,0.4), inset 0 -3px 4px rgba(0,0,0,0.12), inset 0 2px 3px rgba(255,255,255,0.5);
    animation:cellpop .4s ease;
  }
  @keyframes cellpop{
    0%{transform:scale(0.3); opacity:0;}
    70%{transform:scale(1.2);}
    100%{transform:scale(1);}
  }

  .goal-banner{
    text-align:center;
    padding:10px;
    border-radius:14px;
    background:linear-gradient(120deg,var(--leaf),#3FA85C);
    color:#fff;
    font-family:'Baloo 2',cursive;
    font-size:16px;
    margin-top:10px;
    display:none;
    box-shadow:0 4px 0 rgba(0,0,0,0.15);
  }
  .goal-banner.show{display:block; animation:cellpop .5s ease;}

  .payment-form{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:14px;
    padding-top:14px;
    border-top:2px dashed #E9DCC0;
  }
  .payment-form input{
    border:2px solid #E9DCC0;
    border-radius:12px;
    padding:8px 11px;
    font-family:'Nunito',sans-serif;
    font-size:13.5px;
    font-weight:600;
  }
  .payment-form input.amount{width:110px; font-weight:800;}
  .payment-form input.note{flex:1; min-width:150px;}

  .off-plan-toggle{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    font-weight:700;
    color:#8a5a3f;
    margin-top:8px;
    cursor:pointer;
    user-select:none;
  }
  .off-plan-toggle input{transform:scale(1.1);}

  .history{margin-top:6px;}
  .history h2{font-size:15px; margin-bottom:8px;}
  .payment-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 10px;
    border-radius:12px;
    background:#fff;
    margin-bottom:6px;
    font-size:13px;
    border-left:5px solid var(--leaf);
  }
  .payment-item.off-plan{border-left-color:var(--coral);}
  .payment-item .amt{font-weight:800; color:var(--sky-deep);}
  .payment-item .note{color:#6b6255; font-weight:600; flex:1; margin:0 8px;}
  .payment-item .tag{font-size:10.5px; font-weight:800; color:var(--coral);}
  .empty{font-size:13px; color:#8a8272; text-align:center; padding:10px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>🪙 Закрыть кредит</h1>
    <p>каждый платёж закрашивает ячейку</p>
  </div>

  <div class="card">
    <div class="setup-row" id="setupRow">
      <div class="field">
        <label>Сумма долга, грн</label>
        <input type="number" id="targetInput" placeholder="8000" value="8000">
      </div>
      <button class="btn btn-sky" onclick="setTarget()">Задать цель</button>
    </div>
  </div>

  <div class="card">
    <div class="progress-head">
      <div class="amounts"><span id="savedAmt">0</span> / <span id="targetAmt">8000</span> грн</div>
      <div class="pct" id="pctBadge">0%</div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="goal-banner" id="goalBanner">🎉 Кредит закрыт!</div>

    <div class="payment-form">
      <input class="amount" type="number" id="payAmount" placeholder="Сумма">
      <input class="note" type="text" id="payNote" placeholder="За что / откуда (необязательно)">
      <button class="btn btn-leaf" onclick="addPayment(false)">+ Внести платёж</button>
    </div>
    <label class="off-plan-toggle">
      <input type="checkbox" id="offPlanCheck">
      это незапланированная трата в сторону — просто хочу отметить
    </label>
  </div>

  <div class="card history">
    <h2>История</h2>
    <div id="historyList"></div>
  </div>
</div>

<script>
let target = 8000;
let saved = 0;
let payments = []; // {amount, note, offPlan}
const CELLS = 40;

function setTarget(){
  const v = parseFloat(document.getElementById('targetInput').value);
  if(!v || v<=0) return;
  target = v;
  render();
}

function addPayment(){
  const amtInput = document.getElementById('payAmount');
  const noteInput = document.getElementById('payNote');
  const offPlan = document.getElementById('offPlanCheck').checked;
  const amt = parseFloat(amtInput.value);
  if(!amt || amt<=0) return;
  payments.push({amount:amt, note: noteInput.value.trim(), offPlan});
  if(!offPlan) saved += amt;
  amtInput.value=''; noteInput.value=''; document.getElementById('offPlanCheck').checked=false;
  render();
}

function render(){
  document.getElementById('targetInput').value = target;
  document.getElementById('savedAmt').textContent = saved.toLocaleString('ru-RU');
  document.getElementById('targetAmt').textContent = target.toLocaleString('ru-RU');
  const pct = Math.min(100, Math.round((saved/target)*100));
  document.getElementById('pctBadge').textContent = pct + '%';

  const filledCells = Math.round((Math.min(saved,target)/target)*CELLS);
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for(let i=0;i<CELLS;i++){
    const d = document.createElement('div');
    d.className = 'cell' + (i<filledCells ? ' filled' : '');
    grid.appendChild(d);
  }

  document.getElementById('goalBanner').classList.toggle('show', saved>=target);

  const list = document.getElementById('historyList');
  if(payments.length===0){
    list.innerHTML = '<div class="empty">Пока нет платежей — внеси первый выше.</div>';
  } else {
    list.innerHTML = payments.slice().reverse().map(p => `
      <div class="payment-item ${p.offPlan?'off-plan':''}">
        <div class="amt">${p.offPlan?'−':'+'}${p.amount.toLocaleString('ru-RU')} грн</div>
        <div class="note">${escapeHtml(p.note||'')}</div>
        ${p.offPlan?'<div class="tag">не по плану</div>':''}
      </div>
    `).join('');
  }
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

render();
</script>
</body>
</html>
